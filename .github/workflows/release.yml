name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
            format: tar.gz
          - os: linux
            arch: arm64
            ext: ""
            format: tar.gz
          - os: windows
            arch: amd64
            ext: ".exe"
            format: zip
          - os: windows
            arch: arm64
            ext: ".exe"
            format: zip
          - os: darwin
            arch: amd64
            ext: ""
            format: tar.gz
          - os: darwin
            arch: arm64
            ext: ""
            format: tar.gz
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          OUTPUT_NAME="gateway${{ matrix.ext }}"
          VERSION="${{ github.ref_name }}"
          [ -z "$VERSION" ] && VERSION="latest"
          GIT_COMMIT="${{ github.sha }}"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.GitCommit=${GIT_COMMIT:0:7} -X main.BuildTime=${BUILD_TIME}"
          go build -trimpath -ldflags="${LDFLAGS}" -o "$OUTPUT_NAME" ./cmd/gateway
      - name: Package Artifacts
        run: |
          TARGET_NAME="antigravity-gateway_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "$TARGET_NAME"
          
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp gateway.exe "$TARGET_NAME/"
            [ -f run.bat ] && cp run.bat "$TARGET_NAME/"
          else
            cp gateway "$TARGET_NAME/"
            chmod +x "$TARGET_NAME/gateway"
          fi

          [ -f .env.example ] && cp .env.example "$TARGET_NAME/"
          [ -f LICENSE ] && cp LICENSE "$TARGET_NAME/"
          [ -f README.md ] && cp README.md "$TARGET_NAME/"

          if [ "${{ matrix.format }}" = "zip" ]; then
            zip -r "${TARGET_NAME}.zip" "$TARGET_NAME"
            echo "ASSET=${TARGET_NAME}.zip" >> $GITHUB_ENV
          else
            tar -czvf "${TARGET_NAME}.tar.gz" "$TARGET_NAME"
            echo "ASSET=${TARGET_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: android
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pin every component the build needs instead of the legacy `tools`
          # meta-package, which is no longer published by Google.
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Inject Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AGW_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AGW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AGW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AGW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::AGW_KEYSTORE_BASE64 is missing; refusing to build a differently-signed APK."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "AGW_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "AGW_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "AGW_KEY_ALIAS=$KEY_ALIAS"
            echo "AGW_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Verify APK Signature
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/antigravity-gateway-*.apk | head -1)
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          # apksigner changed this label between build-tools releases ("Signer #1 certificate" in
          # older tools, "V2 Signer: certificate" in newer ones), so match the stable tail only.
          DIGEST=$(grep -oiE 'certificate SHA-256 digest: [0-9a-f]{64}' /tmp/certs.txt | head -1 | awk '{print $NF}')
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not read a SHA-256 signing certificate from the APK."
            exit 1
          fi
          if grep -qi 'CN=Android Debug' /tmp/certs.txt; then
            echo "::error::APK is signed with the debug key rather than the release key."
            exit 1
          fi
          echo "APK signing certificate SHA-256: $DIGEST"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-gateway-apk
          path: android/app/build/outputs/apk/release/antigravity-gateway-*.apk
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [build, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Generate Checksums
        working-directory: ./dist
        run: |
          sha256sum * > checksums.txt || shasum -a 256 * > checksums.txt
          cat checksums.txt

      - name: Determine Release Tag & Name
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "title=Release ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          prerelease: false
          draft: false
          generate_release_notes: true
          files: |
            ./dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
