name: Build & Test Gateway and Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test Go & Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pin every component the build needs instead of the legacy `tools`
          # meta-package, which is no longer published by Google.
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Go Unit Tests
        run: |
          go test -v -short ./...
          go vet ./...

      - name: Cross-compile All Release Platforms
        run: |
          chmod +x scripts/build-matrix.sh
          ./scripts/build-matrix.sh "$RUNNER_TEMP/matrix"

      - name: Build Android JNI Libraries (4 ABIs)
        run: |
          chmod +x scripts/build-android-libs.sh
          ./scripts/build-android-libs.sh

      - name: Run Android Lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug

      - name: Run Android Unit Tests
        working-directory: android
        run: |
          ./gradlew :app:testDebugUnitTest

      - name: Inject Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AGW_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AGW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AGW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AGW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::AGW_KEYSTORE_BASE64 is missing; refusing to build a differently-signed APK."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "AGW_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "AGW_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "AGW_KEY_ALIAS=$KEY_ALIAS"
            echo "AGW_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble Android Release APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease

      - name: Verify APK Signature
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/helix-gateway-*.apk | head -1)
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          # apksigner changed this label between build-tools releases ("Signer #1 certificate" in
          # older tools, "V2 Signer: certificate" in newer ones), so match the stable tail only.
          DIGEST=$(grep -oiE 'certificate SHA-256 digest: [0-9a-f]{64}' /tmp/certs.txt | head -1 | awk '{print $NF}')
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not read a SHA-256 signing certificate from the APK."
            exit 1
          fi
          if grep -qi 'CN=Android Debug' /tmp/certs.txt; then
            echo "::error::APK is signed with the debug key rather than the release key."
            exit 1
          fi
          echo "APK signing certificate SHA-256: $DIGEST"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: helix-gateway-apk
          path: android/app/build/outputs/apk/release/helix-gateway-*.apk
          retention-days: 14
          if-no-files-found: error
